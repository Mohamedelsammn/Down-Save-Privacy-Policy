name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to publish legal drafts
        run: |
          if grep -qi 'Draft — backend details pending' privacy/index.html; then
            echo 'Privacy policy still contains unverified backend claims; deployment is blocked.' >&2
            exit 1
          fi
          if grep -qi 'Draft for review' terms/index.html; then
            echo 'Terms are still marked as draft; deployment is blocked.' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp -R index.html privacy terms contact assets .nojekyll _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
