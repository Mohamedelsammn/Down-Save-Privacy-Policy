name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check legal page status and contact
        run: |
          for page in privacy/index.html terms/index.html; do
            if grep -q 'Effective date pending verification' "$page"; then
              grep -q 'Draft pending implementation review' "$page" || {
                echo "$page needs a visible draft notice." >&2
                exit 1
              }
            else
              grep -q 'Effective date:' "$page"
            fi
          done
          grep -q 'Media and device access' privacy/index.html
          grep -q 'Deletion and Clear Data' privacy/index.html
          grep -q 'mohamed.elsamman.dev@gmail.com' contact/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp -R index.html privacy terms contact assets .nojekyll _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
