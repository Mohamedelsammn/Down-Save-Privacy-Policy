name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required legal disclosures
        run: |
          if grep -qi 'Draft' privacy/index.html terms/index.html; then
            echo 'A legal page is still marked as a draft.' >&2
            exit 1
          fi
          grep -q 'Effective date:' privacy/index.html
          grep -q 'Effective date:' terms/index.html
          grep -q 'external media retrieval service' privacy/index.html
          grep -q 'We therefore cannot state a retention period' privacy/index.html
          grep -q 'mohamed.elsamman.dev@gmail.com' contact/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp -R index.html privacy terms contact assets .nojekyll _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
